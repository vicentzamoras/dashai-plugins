# Checks a PR that adds or changes a plugin's entry, removed.json or
# revoked.json (scripts/validate.py).
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The validator, from main (never the PR's own copy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: The PR, merged into main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 2
      - run: python3 -m pip install --break-system-packages packaging
      - name: Check
        working-directory: pr
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          other=$(echo "$changed" | grep -v -E '^(plugins/[a-z0-9-]+\.json|removed\.json|revoked\.json)$' || true)
          if [ -n "$other" ]; then
            echo "A PR to the store only changes plugins/<id>.json (or removed.json, revoked.json). Also changed:"
            echo "$other"
            exit 1
          fi
          entries=$(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- plugins || true)
          if [ "$(echo "$entries" | grep -c .)" -gt 1 ]; then
            echo "One plugin per PR."
            exit 1
          fi
          python3 ../base/scripts/validate.py check $entries
