# Builds index.json (scripts/validate.py) after a merge, every 6 hours (new
# releases need no PR; only what changed is reviewed) and on demand ("full":
# every release again, when the bot's rules change). It commits only when what
# the index lists changes.
name: Build index

on:
  push:
    branches: [main]
    paths: ["plugins/**", "removed.json", "scripts/**"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Review every release again
        type: boolean
        default: false

permissions:
  contents: write
  issues: write # notify: tells an author why a release was left out

concurrency:
  group: build-index

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: python3 scripts/validate.py build $FULL
      - name: Commit
        run: |
          git add index.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update index.json"
          git push
