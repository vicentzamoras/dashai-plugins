# Builds index.json (scripts/validate.py) after a merge, every day (new
# releases need no PR; only what changed is reviewed) and on demand; on
# Mondays it reviews every release again. built_at changes every build, so
# every build commits: index.json says when it was last reviewed.
name: Build index

on:
  push:
    branches: [main]
    paths: ["plugins/**", "removed.json", "scripts/**"]
  schedule:
    - cron: "17 6 * * *"
    - cron: "47 6 * * 1" # weekly: review everything again
  workflow_dispatch:

permissions:
  contents: write
  issues: write # notify: tells an author why a release was left out

concurrency:
  group: build-index

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          full=""
          if [ "${{ github.event.schedule }}" = "47 6 * * 1" ]; then full=--full; fi
          python3 scripts/validate.py build $full
      - name: Commit
        run: |
          git add index.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update index.json"
          git push
